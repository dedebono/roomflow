services:
  postgres:
    image: postgres:16-alpine
    container_name: roomflow-postgres
    restart: always
    environment:
      POSTGRES_USER: roomflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomflow}
      POSTGRES_DB: roomflow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roomflow-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://roomflow:${POSTGRES_PASSWORD:-roomflow}@postgres:5432/roomflow?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      STORAGE_TYPE: LOCAL
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      EMAIL_ENABLED: "false"
      EMAIL_FROM: noreply@roomflow.local
      WAHA_ENABLED: "true"
      WAHA_API_URL: ${WAHA_API_URL}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY}
      # QA: lewati gateway, checkout langsung lunas.
      # WAJIB "false" sebelum go-live — dengan ini renter dapat booking
      # gratis tanpa pernah membayar.
      PAYMENT_BYPASS: ${PAYMENT_BYPASS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/app/dist/uploads
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    container_name: roomflow-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    depends_on:
      - backend
    ports:
      - '3001:3000'

  nginx:
    build:
      context: .
      dockerfile: .github/deploy/nginx.Dockerfile
    container_name: roomflow-nginx
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
      - frontend

  waha:
    image: devlikeapro/waha:latest
    container_name: roomflow-waha
    restart: always
    ports:
      - "3002:3000"
    environment:
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=admin
      - WAHA_LOG_LEVEL=info
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:?WHATSAPP_API_KEY wajib diisi di .env}
      - WAHA_CORS_ENABLED=true
      - WAHA_CORS_ORIGIN=*
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  postgres_data:
     external: true
     name: roomflow_postgres_data
  uploads_data:
  waha_sessions:
